server.port=8081

spring.application.name=equispedia
spring.datasource.url=jdbc:postgresql://localhost:5432/equispedia
spring.datasource.username=postgres
spring.datasource.password=123momiaes
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Asegura que Spring ejecute el script de inicialización de datos
spring.sql.init.mode=always

# DIFERIR: Hace que JPA/Hibernate cree las tablas ANTES de que se ejecute el data.sql
spring.jpa.defer-datasource-initialization=true

# GraphQL
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

# Stripe Configuration
stripe.secret.key=${STRIPE_SECRET_KEY}

# Email SMTP Configuration
spring.mail.host=mail.equispedia.online
# Asumiendo puerto 587 para TLS o 465 para SSL (dejamos 587 por defecto, aunque mencionaste 21, 21 es FTP)
spring.mail.port=587
spring.mail.username=no-reply@equispedia.online
spring.mail.password=Equispedia159
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
