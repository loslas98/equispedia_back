name: Deploy Backend

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Log in to OCIR
        run: |
          echo "${{ secrets.OCIR_AUTH_TOKEN }}" | docker login iad.ocir.io \
            -u "${{ secrets.OCIR_USERNAME }}" --password-stdin

      - name: Build image
        run: |
          docker build -t iad.ocir.io/${{ secrets.OCIR_USERNAME }}/equispedia-backend:latest .

      - name: Push image
        run: |
          docker push iad.ocir.io/${{ secrets.OCIR_USERNAME }}/equispedia-backend:latest

      - name: Deploy backend container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.OCIR_AUTH_TOKEN }}" | sudo docker login iad.ocir.io -u "${{ secrets.OCIR_USERNAME }}" --password-stdin
            sudo docker pull iad.ocir.io/${{ secrets.OCIR_USERNAME }}/equispedia-backend:latest
            sudo docker rm -f equispedia_backend || true
            sudo docker run -d \
              --name equispedia_backend \
              --network equispedia_back_equispedia_network \
              --restart unless-stopped \
              -p 8081:8081 \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              -e DB_URL="jdbc:postgresql://db:5432/${{ secrets.DB_NAME }}" \
              -e DB_USER="${{ secrets.DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              iad.ocir.io/${{ secrets.OCIR_USERNAME }}/equispedia-backend:latest

      - name: Deploy to OCI instance via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.OCIR_AUTH_TOKEN }}" | sudo docker login iad.ocir.io -u "${{ secrets.OCIR_USERNAME }}" --password-stdin
            sudo docker pull iad.ocir.io/${{ secrets.OCIR_USERNAME }}/equispedia-backend:latest
            sudo docker rm -f equispedia_backend || true
            sudo docker run -d \
              --name equispedia_backend \
              --network equispedia_back_equispedia_network \
              --restart unless-stopped \
              -p 8081:8081 \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              -e DB_URL="jdbc:postgresql://db:5432/${{ secrets.DB_NAME }}" \
              -e DB_USER="${{ secrets.DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              iad.ocir.io/${{ secrets.OCIR_USERNAME }}/equispedia-backend:latest